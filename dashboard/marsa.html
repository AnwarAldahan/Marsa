<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مرسَى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Marsa dashboard. Every number on this page comes from the Marsa API response
  (POST /api/decision-support/analyze). There is no demo data and no fallback data:
  if the API is not reachable the page says so and shows nothing else.
  Source badges: AIS = observed vessel data, اصطناعي = synthetic cargo/events,
  تنبؤ = XGBoost model, محاكاة = Digital Twin, مدخل المستخدم = stress values typed here.
-->
<style>
:root {
  --navy:#12263F; --navy-2:#17304D; --panel:#1B3654; --panel-2:#234264; --line:#38597F;
  --text:#F1F5FA; --muted:#A3B4CA; --teal:#3ED0B6; --teal-dim:#2A8F7C; --amber:#F3B657;
  --red:#F6837C; --sky:#7FB2E5; --violet:#B9A2F0;
  --font:'Tajawal', system-ui, sans-serif; --mono:'IBM Plex Mono', monospace; color-scheme:dark;
}
* { box-sizing:border-box; }
html,body { margin:0; background:var(--navy); color:var(--text); font-family:var(--font); }
.content { max-width:1360px; margin:0 auto; padding:24px 32px 70px; }
.topbar { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:26px; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:10px; }
.brand .word { font-size:24px; font-weight:800; }
.brand .sub { font-size:12px; color:var(--muted); margin-top:2px; }
.controls { display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; }
.ctl { display:flex; flex-direction:column; gap:4px; font-size:11.5px; color:var(--muted); }
.ctl input { background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px;
  padding:8px 10px; font-family:var(--mono); font-size:12.5px; width:190px; direction:ltr; }
.ctl input.small { width:90px; }
.ctl.stress input { border-color:var(--violet); }
button { font-family:var(--font); cursor:pointer; }
.b-primary { background:var(--teal); color:#062033; border:0; border-radius:8px; padding:9px 18px; font-weight:700; font-size:13px; }
.b-secondary { background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 14px; font-size:12.5px; }
.status { font-size:12px; color:var(--muted); min-height:18px; margin-top:6px; }
.status.err { color:var(--red); } .status.ok { color:var(--teal); }
section { margin-bottom:34px; }
.storylabel { font-size:12px; color:var(--muted); font-weight:500; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
.storylabel .num { width:20px; height:20px; border-radius:50%; background:var(--panel-2); border:1px solid var(--line);
  color:var(--teal); font-family:var(--mono); font-size:11px; display:flex; align-items:center; justify-content:center; }
h2.stitle { font-size:18px; font-weight:700; margin:0 0 14px; }
.note { font-size:12px; color:var(--muted); line-height:1.7; }
.badge { display:inline-block; font-size:10.5px; font-weight:700; border-radius:20px; padding:1px 8px; margin-inline-start:6px;
  border:1px solid currentColor; vertical-align:middle; white-space:nowrap; }
.b-ais { color:var(--teal); } .b-syn { color:var(--amber); } .b-pred { color:var(--sky); }
.b-sim { color:var(--violet); } .b-user { color:var(--violet); } .b-pub { color:var(--muted); }
.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 14px; }
.card .lbl { font-size:12px; color:var(--muted); margin-bottom:6px; line-height:1.5; }
.card .val { font-family:var(--mono); font-size:20px; font-weight:600; }
.card .sub { font-size:11.5px; color:var(--muted); margin-top:4px; line-height:1.5; }
.val.amber { color:var(--amber); } .val.red { color:var(--red); } .val.teal { color:var(--teal); }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; }
.empty { text-align:center; padding:60px 20px; color:var(--muted); font-size:14px; }
/* map */
.map-head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
.map-title { font-size:14px; font-weight:700; }
.scrub { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); }
.scrub input[type=range] { width:260px; accent-color:var(--teal); }
.scrub .hh { font-family:var(--mono); color:var(--text); min-width:70px; }
.map-svg { width:100%; height:auto; display:block; }
.legend { display:flex; gap:16px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); margin-top:8px; }
.legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-inline-end:5px; vertical-align:-2px; border:1.5px solid; }
.tip { position:fixed; z-index:50; background:var(--navy-2); border:1px solid var(--teal); border-radius:8px; padding:9px 12px;
  font-size:12px; line-height:1.7; pointer-events:none; display:none; max-width:280px; }
/* chart */
.chart-svg { width:100%; height:auto; display:block; }
/* agents */
.agents { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:12px; }
.agent h3 { font-size:14px; margin:0 0 10px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.pill { font-size:11.5px; font-weight:700; border-radius:20px; padding:2px 10px; background:var(--panel-2); }
.pill.NORMAL,.pill.LOW,.pill.low { color:var(--teal); } .pill.MODERATE,.pill.MEDIUM,.pill.moderate,.pill.ELEVATED,.pill.elevated { color:var(--amber); }
.pill.CONGESTED,.pill.CRITICAL,.pill.HIGH,.pill.severe { color:var(--red); }
.row { display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:5px 0; border-bottom:1px solid rgba(56,89,127,.45); }
.row:last-child { border-bottom:0; } .row b { font-family:var(--mono); font-weight:600; }
/* decision */
.decision { border-inline-start:4px solid var(--teal); }
.decision.alert { border-inline-start-color:var(--amber); }
.summary { font-size:14px; line-height:1.9; margin:0 0 14px; }
.cands { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px; margin-top:6px; }
.cand { background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:14px; cursor:pointer; }
.cand.sel { border-color:var(--teal); }
.cand .ct { font-size:13.5px; font-weight:700; margin-bottom:6px; display:flex; gap:8px; align-items:center; }
.cand .rank { font-family:var(--mono); color:var(--teal); }
.cand .delta { font-size:12px; margin-top:8px; }
.delta.good { color:var(--teal); } .delta.none { color:var(--muted); }
.sources { margin-top:14px; font-size:12px; color:var(--muted); line-height:1.8; }
.sources li { margin-bottom:4px; }
.human { margin-top:12px; font-size:12.5px; color:var(--muted); }
@media (max-width:720px) { .content { padding:16px; } .ctl input { width:150px; } .scrub input[type=range] { width:160px; } }
</style>
</head>
<body>
<div class="content">

  <div class="topbar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M6 26 Q13 20 20 26 T34 26" stroke="#3ED0B6" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M6 31 Q13 25 20 31 T34 31" stroke="#2A8F7C" stroke-width="2" fill="none" stroke-linecap="round"/>
        <rect x="18" y="6" width="4" height="18" rx="2" fill="#3ED0B6"/>
        <circle cx="20" cy="6" r="3.4" fill="#3ED0B6"/>
      </svg>
      <div>
        <div class="word">مرسَى</div>
        <div class="sub">Marsa — AI Port Intelligence · ميناء لوس أنجلوس (بديل تجريبي)</div>
      </div>
    </div>
    <div>
      <form class="controls" id="ctlForm">
        <label class="ctl">الساعة (UTC، سنة 2025)
          <input id="inTs" value="2025-07-10T19:00:00Z" required>
        </label>
        <label class="ctl stress">أرصفة مغلقة <span class="badge b-user">سيناريو</span>
          <input id="inClosed" class="small" type="number" min="0" step="1" value="0">
        </label>
        <label class="ctl stress">زيادة السفن القادمة % <span class="badge b-user">سيناريو</span>
          <input id="inSurge" class="small" type="number" min="0" step="10" value="0">
        </label>
        <label class="ctl">عنوان الخادم
          <input id="inApi" value="http://127.0.0.1:8000">
        </label>
        <button class="b-primary" type="submit">تحليل</button>
      </form>
      <div class="status" id="status"></div>
    </div>
  </div>

  <div id="app"><div class="empty">اختر ساعة واضغط «تحليل». تُعرض البيانات بعد وصول رد الخادم فقط.</div></div>
</div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const AR = { NORMAL:'طبيعي', ELEVATED:'مرتفع', CONGESTED:'مزدحم', MODERATE:'متوسط', CRITICAL:'حرج',
               LOW:'منخفض', MEDIUM:'متوسط', HIGH:'مرتفع', low:'منخفض', moderate:'متوسط', elevated:'مرتفع', severe:'شديد' };
  const TITLES = { baseline:'عدم إجراء تغيير تشغيلي', shortest_first:'الأولوية للسفن ذات مدة الخدمة الأقصر',
                   extra_berth:'فتح رصيف إضافي مؤقت' };
  const EVENT_AR = { demand_surge:'زيادة طلب', landside_access_disruption:'تعطل الوصول البري',
                     labor_operational_disruption:'تعطل تشغيلي/عمالي', logistics_disruption:'تعطل لوجستي' };
  const BADGE = { ais:['b-ais','AIS'], syn:['b-syn','اصطناعي'], pred:['b-pred','تنبؤ النموذج'],
                  sim:['b-sim','محاكاة'], obs:['b-ais','مرصود'], user:['b-user','مدخل المستخدم'], pub:['b-pub','مصدر عام'] };
  const badge = k => `<span class="badge ${BADGE[k][0]}">${BADGE[k][1]}</span>`;
  const num = (v, d = 0) => (v === null || v === undefined || Number.isNaN(+v)) ? '—'
    : (+v).toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: d });
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const hrs = h => h === null || h === undefined ? '—' : `${num(h, Math.abs(h) < 10 && h % 1 ? 1 : 0)} س`;
  let DATA = null, SEL = null, HOUR = 0;

  // ---------- API ----------
  async function analyze(ev) {
    if (ev) ev.preventDefault();
    const base = $('inApi').value.replace(/\/+$/, '');
    const body = { timestamp_utc: $('inTs').value.trim() };
    const closed = +$('inClosed').value || 0, surge = +$('inSurge').value || 0;
    if (closed || surge) body.stress = { berths_closed: closed, arrival_surge_pct: surge };
    setStatus('جاري التحليل…', '');
    try {
      const res = await fetch(base + '/api/decision-support/analyze', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) {
        const detail = typeof out.detail === 'string' ? out.detail : JSON.stringify(out.detail || out);
        throw new Error(`رفض الخادم الطلب (${res.status}): ${detail}`);
      }
      DATA = out; SEL = out.digital_twin.results[0].candidate_id; HOUR = 0;
      render();
      setStatus('تم التحليل', 'ok');
    } catch (e) {
      DATA = null;
      $('app').innerHTML = '<div class="empty">لا توجد بيانات لعرضها.</div>';
      setStatus(e.message.startsWith('رفض') ? e.message : 'تعذّر الاتصال بالخادم. شغّلي الـ API ثم أعيدي المحاولة.', 'err');
    }
  }
  function setStatus(t, cls) { const s = $('status'); s.textContent = t; s.className = 'status ' + cls; }

  // ---------- helpers on twin results ----------
  const result = id => DATA.digital_twin.results.find(r => r.candidate_id === id);
  const baseline = () => result('baseline');

  // State of every vessel at hour h of the selected candidate (all from the twin vessel lists).
  function stateAt(r, h) {
    const sc = DATA.digital_twin.scenario;
    const berthed = sc.vessels_at_berth.filter(v => v.leaves_in_h > h)
      .map(v => ({ id: v.call_id, mmsi: v.mmsi, kind: 'now', leaves: v.leaves_in_h - h }));
    const waiting = [], coming = [];
    r.vessels.forEach(v => {
      const b = v.berth_h;
      if (b !== null && b <= h && h < b + v.service_h) berthed.push({ id: v.call_id, mmsi: v.mmsi, kind: 'sim', leaves: b + v.service_h - h });
      else if (v.arrival_h <= h && (b === null || b > h)) waiting.push({ id: v.call_id, mmsi: v.mmsi, waited: h - v.arrival_h,
        sched: v.scheduled_berth_h - h, cap: Math.max(0, h - Math.max(v.arrival_h, v.scheduled_berth_h)) });
      else if (v.arrival_h > h) coming.push({ id: v.call_id, mmsi: v.mmsi, eta: v.arrival_h - h });
    });
    return { berthed, waiting, coming };
  }

  // ---------- render ----------
  function render() {
    const d = DATA, sc = d.digital_twin.scenario, m = d.domain_agents.maritime, c = d.domain_agents.cargo,
          ew = d.domain_agents.events_weather, s = d.port_state, ml = d.ml_forecast;
    const best = d.digital_twin.results[0];
    const shortage = baseline().kpis.capacity_wait_vessel_hours > 0;
    $('app').innerHTML = `
    <section>
      <div class="storylabel"><span class="num">١</span> ماذا يحدث الآن؟</div>
      <h2 class="stitle">حالة الميناء في <bdi dir="ltr">${esc(d.authoritative_timestamp.replace('+00:00', ' UTC').replace('T', ' '))}</bdi></h2>
      <div class="grid">
        <div class="card"><div class="lbl">السفن في منطقة الميناءين (لوس أنجلوس ولونق بيتش) ${badge('ais')}</div>
          <div class="val">${num(m.evidence.vessels)}</div>
          <div class="sub">منها ${num(m.evidence.waiting_vessels)} في منطقة الانتظار المشتركة · حالة الوكيل البحري: <span class="pill ${m.maritime_status}">${AR[m.maritime_status] || m.maritime_status}</span></div></div>
        <div class="card"><div class="lbl">أرصفة لوس أنجلوس المشغولة بسفن شحن ${badge('ais')}</div>
          <div class="val">${num(sc.vessels_at_berth_now)} <span style="font-size:14px;color:var(--muted)">/ ${num(sc.open_berths)}</span></div>
          <div class="sub">${sc.berths_closed ? `${num(sc.berths_closed)} رصيف مغلق في السيناريو ${badge('user')}` : `عدد الأرصفة ${num(sc.container_berths)} ${badge('pub')}`}</div></div>
        <div class="card"><div class="lbl">سفن شحن متجهة للوس أنجلوس تنتظر الآن ${badge('ais')}</div>
          <div class="val ${sc.vessels_waiting_now ? 'amber' : 'teal'}">${num(sc.vessels_waiting_now)}</div>
          <div class="sub">حُددت وجهتها من مسارها في AIS بعد الانتظار</div></div>
        <div class="card"><div class="lbl">سفن شحن قادمة خلال ${num(d.digital_twin.simulation_horizon_hours)} ساعة ${badge('ais')}</div>
          <div class="val">${num(sc.vessels_arriving_in_horizon)}</div>
          <div class="sub">${sc.arrival_surge_pct ? `مع زيادة ${num(sc.arrival_surge_pct)}% ${badge('user')}` : 'جدول الوصول الفعلي'}</div></div>
        <div class="card"><div class="lbl">إشغال الساحة ${badge('syn')}</div>
          <div class="val ${c.evidence.yard_occupancy_percent >= 85 ? 'red' : c.evidence.yard_occupancy_percent >= 75 ? 'amber' : ''}">${num(c.evidence.yard_occupancy_percent, 1)}%</div>
          <div class="sub">نسبة من مقياس افتراضي (10,000 وحدة)، وليست سعة حقيقية · حالة وكيل البضائع: <span class="pill ${c.cargo_status}">${AR[c.cargo_status] || c.cargo_status}</span></div></div>
        <div class="card"><div class="lbl">الرياح والموج ${badge('obs')}</div>
          <div class="row"><span>سرعة الرياح (الوحدة غير مؤكدة، يُفترض كم/س)</span><b>${num(s.wind_speed_10m, 1)}</b></div>
          <div class="row"><span>ارتفاع الموج (م)</span><b>${num(s.wave_height, 2)}</b></div>
          <div class="sub">من Open-Meteo داخل ملف AIS · ${ew.external_event_assessment.active
            ? `حدث نشط: ${EVENT_AR[ew.external_event_assessment.type] || esc(ew.external_event_assessment.type)} (${AR[ew.external_event_assessment.severity] || esc(ew.external_event_assessment.severity)}) ${badge('syn')}`
            : 'لا يوجد حدث نشط'}</div></div>
      </div>
      <div class="panel" style="margin-top:14px">
        <div class="map-head">
          <div class="map-title">أرصفة لوس أنجلوس وسفن الشحن ${badge('ais')} ${badge('sim')}</div>
          <div class="scrub">
            <span>إعادة تشغيل المحاكاة:</span>
            <input type="range" id="hourSlider" min="0" max="${d.digital_twin.simulation_horizon_hours}" step="1" value="${HOUR}">
            <span class="hh" id="hourLbl"></span>
          </div>
        </div>
        <svg class="map-svg" id="mapSvg" viewBox="0 0 1100 330" role="img" aria-label="خريطة الأرصفة والسفن"></svg>
        <div class="legend">
          <span><i style="border-color:var(--sky);background:rgba(127,178,229,.25)"></i>رصيف مشغول</span>
          <span><i style="border-color:var(--teal);border-style:dashed"></i>رصيف متاح</span>
          <span><i style="border-color:var(--muted);background:repeating-linear-gradient(45deg,transparent 0 3px,rgba(163,180,202,.35) 3px 5px)"></i>رصيف مغلق (سيناريو)</span>
          <span><i style="border-color:var(--amber);background:rgba(243,182,87,.25)"></i>سفينة تنتظر موعد رسوها</span>
          <span><i style="border-color:var(--red);background:rgba(246,131,124,.25)"></i>سفينة تنتظر رصيفًا شاغرًا</span>
          <span><i style="border-color:var(--muted)"></i>سفينة قادمة</span>
        </div>
        <div class="note" style="margin-top:8px">الخريطة تعرض الخيار المحدد في القسم ٤. الساعة صفر هي حالة AIS الفعلية؛ ما بعدها نتيجة محاكاة. مرّري المؤشر على أي سفينة لرؤية بياناتها.</div>
      </div>
    </section>

    <section>
      <div class="storylabel"><span class="num">٢</span> ماذا سيحدث؟</div>
      <h2 class="stitle">خلال الساعات القادمة</h2>
      <div class="grid" style="grid-template-columns:minmax(260px,1fr) minmax(320px,2.2fr)">
        <div class="card"><div class="lbl">مؤشر ضغط البضائع بعد ${num(ml.horizon_hours)} ساعات ${badge('pred')}</div>
          ${ml.status === 'success' ? `
          <div class="val ${ml.classification === 'HIGH' ? 'red' : ml.classification === 'MEDIUM' ? 'amber' : 'teal'}">${AR[ml.classification] || ml.classification}</div>
          <div class="sub">درجة النموذج ${num(ml.congestion_score, 3)} (حد «مرتفع» ${num(ml.threshold_metadata.high, 3)} · حد التنبيه ${num(ml.threshold_metadata.alert, 3)})</div>
          <div class="sub">الدرجة ليست احتمالًا. الهدف مؤشر تقريبي مبني من بيانات البضائع ${badge('syn')}</div>`
          : `<div class="val">—</div><div class="sub">النموذج غير متاح لهذه الساعة: ${esc(ml.reason)}</div>`}
        </div>
        <div class="card"><div class="lbl">السفن على الأرصفة والسفن المنتظرة خلال ${num(d.digital_twin.simulation_horizon_hours)} ساعة — ${esc(TITLES[SEL] || SEL)} ${badge('sim')}</div>
          <svg class="chart-svg" id="chartSvg" viewBox="0 0 700 190" role="img" aria-label="السفن على الأرصفة والمنتظرة عبر الساعات"></svg>
          <div class="legend"><span><i style="border-color:var(--sky);background:var(--sky)"></i>على الأرصفة</span>
            <span><i style="border-color:var(--amber);background:var(--amber)"></i>منتظرة</span>
            <span><i style="border-color:var(--muted);border-style:dashed"></i>الأرصفة المفتوحة</span></div>
        </div>
      </div>
    </section>

    <section>
      <div class="storylabel"><span class="num">٣</span> لماذا؟ — ما يراه كل وكيل</div>
      <div class="agents">
        <div class="card agent"><h3>الوكيل البحري ${badge('ais')}<span class="pill ${m.maritime_status}">${AR[m.maritime_status] || m.maritime_status}</span></h3>
          <div class="row"><span>السفن في المنطقة</span><b>${num(m.evidence.vessels)}</b></div>
          <div class="row"><span>المنتظرة</span><b>${num(m.evidence.waiting_vessels)}</b></div>
          <div class="row"><span>نسبة الانتظار</span><b>${num(m.evidence.waiting_ratio * 100, 1)}%</b></div>
          <div class="row"><span>القادمة / المغادرة</span><b>${num(m.evidence.approaching_vessels)} / ${num(m.evidence.departing_vessels)}</b></div>
          <div class="row"><span>انتقلت من الانتظار للرصيف (آخر 4 ساعات)</span><b>${num(m.evidence.port_throughput_value)}</b></div>
          <div class="note" style="margin-top:6px">يشمل الميناءين وسفن الشحن والناقلات.</div></div>
        <div class="card agent"><h3>وكيل البضائع ${badge('syn')}<span class="pill ${c.cargo_status}">${AR[c.cargo_status] || c.cargo_status}</span></h3>
          <div class="row"><span>إشغال الساحة</span><b>${num(c.evidence.yard_occupancy_percent, 1)}%</b></div>
          <div class="row"><span>دخول / خروج الحاويات (آخر ساعة)</span><b>${num(c.evidence.container_arrivals_last_1h)} / ${num(c.evidence.container_departures_last_1h)}</b></div>
          <div class="row"><span>متوسط بقاء الحاوية</span><b>${num(c.evidence.average_dwell_time_hours, 1)} س</b></div>
          <div class="row"><span>انتظار الشاحنات</span><b>${num(c.evidence.truck_waiting_time_minutes, 1)} د</b></div>
          <div class="row"><span>حركات البوابة (آخر ساعة)</span><b>${num(c.evidence.gate_throughput_last_1h)}</b></div>
          <div class="note" style="margin-top:6px">بيانات مولّدة ومعايرة على أرقام الميناء الشهرية، وليست قياسات فعلية.</div></div>
        <div class="card agent"><h3>وكيل الأحداث والطقس<span class="pill ${ew.contextual_pressure.level}">${AR[ew.contextual_pressure.level] || ew.contextual_pressure.level}</span></h3>
          <div class="row"><span>الطقس ${badge('obs')}</span><b>${AR[ew.weather_assessment.level] || esc(ew.weather_assessment.level)}</b></div>
          <div class="row"><span>حدث خارجي ${badge('syn')}</span><b>${ew.external_event_assessment.active ? (EVENT_AR[ew.external_event_assessment.type] || esc(ew.external_event_assessment.type)) : 'لا يوجد'}</b></div>
          <div class="row"><span>عطلة أو نهاية أسبوع (بتوقيت لوس أنجلوس)</span><b>${ew.calendar_context.is_public_holiday_local ? 'عطلة' : ew.calendar_context.is_weekend_local ? 'نهاية أسبوع' : 'لا'}</b></div></div>
      </div>
    </section>

    <section>
      <div class="storylabel"><span class="num">٤</span> ماذا نفعل؟</div>
      <div class="panel decision ${shortage ? 'alert' : ''}">
        <div class="lbl" style="font-size:12px;color:var(--teal);font-weight:700;margin-bottom:6px">توصية وكيل الاستراتيجية ${badge('sim')}${d.decision_support.reasoning_mode === 'llm_assisted' ? ' <span class="badge b-pub">صياغة بمساعدة LLM</span>' : ''}</div>
        <p class="summary">${esc(d.decision_support.summary)}</p>
        <div class="cands">${d.digital_twin.results.map(r => candCard(r)).join('')}</div>
        <ul class="sources">${d.digital_twin.sources.map(src => `<li>${sourceLine(src)}</li>`).join('')}
          <li>ترتيب الخيارات حسب إجمالي ساعات انتظار السفن خلال الأفق، بدون أوزان.</li></ul>
        <div class="human">القرار النهائي بيد مشغّل الميناء — مرسى لا ينفذ أي إجراء تلقائيًا.</div>
      </div>
    </section>`;

    document.querySelectorAll('.cand').forEach(el => el.addEventListener('click', () => {
      SEL = el.dataset.id; render(); }));
    $('hourSlider').addEventListener('input', e => { HOUR = +e.target.value; drawMap(); });
    drawMap(); drawChart();
  }

  function candCard(r) {
    const k = r.kpis, vs = r.vs_baseline;
    const delta = !vs ? '<div class="delta none">الأساس للمقارنة</div>'
      : vs.total_wait_vessel_hours < 0 ? `<div class="delta good">أقل بـ ${num(-vs.total_wait_vessel_hours, 1)} ساعة انتظار من عدم التغيير</div>`
      : '<div class="delta none">بدون تحسّن مقارنة بعدم التغيير</div>';
    return `<div class="cand ${r.candidate_id === SEL ? 'sel' : ''}" data-id="${esc(r.candidate_id)}">
      <div class="ct"><span class="rank">#${r.rank}</span>${esc(TITLES[r.candidate_id] || r.title)}</div>
      <div class="row"><span>إجمالي ساعات الانتظار</span><b>${num(k.total_wait_vessel_hours, 1)}</b></div>
      <div class="row"><span>منها بسبب امتلاء الأرصفة</span><b>${num(k.capacity_wait_vessel_hours, 1)}</b></div>
      <div class="row"><span>سفن انتظرت / أقصى انتظار</span><b>${num(k.vessels_waited)} / ${hrs(k.max_wait_hours)}</b></div>
      <div class="row"><span>منتظرة في نهاية الأفق</span><b>${num(k.waiting_end)}</b></div>
      <div class="row"><span>الأرصفة المفتوحة</span><b>${num(k.open_berths)}</b></div>
      ${delta}</div>`;
  }

  function sourceLine(src) {
    const map = { 'OBSERVED (AIS)': 'ais', 'PUBLIC SOURCE': 'pub', 'USER INPUT': 'user', 'LIMITATION': 'pub' };
    const label = {
      'OBSERVED (AIS)': `السفن ومواعيد وصولها ورسوها ومدة خدمتها: ملف ${esc(src.source)}`,
      'PUBLIC SOURCE': `عدد أرصفة الحاويات ${num(src.value)}: مجموع الأرصفة في صفحات محطات الحاويات السبع بموقع ميناء لوس أنجلوس (رقم تقريبي؛ بطاقة الميناء الرسمية لا تذكر عدد الأرصفة)`,
      'USER INPUT': src.value ? `سيناريو الضغط: ${num(src.value.berths_closed)} رصيف مغلق، وزيادة السفن القادمة ${num(src.value.arrival_surge_pct)}%` : '',
      'LIMITATION': 'بيانات AIS تنتهي داخل أفق المحاكاة؛ السفن القادمة بعدها غير معروفة',
    }[src.provenance] || esc(src.source);
    return `${badge(map[src.provenance] || 'pub')} ${label}`;
  }

  // ---------- map ----------
  function drawMap() {
    const d = DATA, sc = d.digital_twin.scenario, r = result(SEL), H = d.digital_twin.simulation_horizon_hours;
    $('hourLbl').textContent = HOUR === 0 ? 'الآن' : `+${HOUR} س`;
    const st = stateAt(r, HOUR);
    const open = r.kpis.open_berths, total = open + sc.berths_closed;
    const W = 1100, cols = Math.min(total, 13), bw = 70, bh = 46, gap = 8;
    let s = `<text x="${W - 20}" y="24" fill="#A3B4CA" font-size="13" text-anchor="start">الأرصفة (${num(st.berthed.length)} مشغولة من ${num(open)} مفتوحة)</text>`;
    const occupied = st.berthed.slice().sort((a, b) => a.leaves - b.leaves);
    for (let i = 0; i < total; i++) {
      const col = i % cols, row = Math.floor(i / cols);
      const x = W - 20 - (col + 1) * (bw + gap) + gap, y = 38 + row * (bh + gap);
      const closed = i >= open, v = !closed ? occupied[i] : null;
      const over = closed && occupied[i];   // more vessels at berth than open berths (closure scenario)
      const fill = closed ? 'url(#hatch)' : v ? 'rgba(127,178,229,.25)' : 'transparent';
      const stroke = closed ? '#A3B4CA' : v ? '#7FB2E5' : '#3ED0B6';
      const tipText = v ? `سفينة MMSI ${v.mmsi}<br>زيارة ${v.id}<br>تغادر بعد ${hrs(v.leaves)}` :
                     over ? `رصيف مغلق في السيناريو<br>ما زالت عليه سفينة MMSI ${over.mmsi} حتى مغادرتها بعد ${hrs(over.leaves)}` :
                     closed ? 'رصيف مغلق في السيناريو' : 'رصيف متاح';
      s += `<g class="hit" data-tip="${esc(tipText)}"><rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="6" fill="${fill}" stroke="${stroke}"
        stroke-width="1.5" ${!closed && !v ? 'stroke-dasharray="4 3"' : ''}/>
        ${v || over ? `<text x="${x + bw / 2}" y="${y + 28}" text-anchor="middle" fill="#F1F5FA" font-size="12" font-family="IBM Plex Mono">${hrs((v || over).leaves).replace(' س', 'h')}</text>` : ''}</g>`;
    }
    const extraRows = Math.max(0, occupied.length - total);
    const yW = 38 + Math.ceil(total / cols) * (bh + gap) + 22;
    s += `<text x="${W - 20}" y="${yW}" fill="#A3B4CA" font-size="13">منطقة الانتظار (${num(st.waiting.length)})${extraRows ? ` · ${extraRows} سفينة إضافية على الأرصفة` : ''}</text>`;
    st.waiting.forEach((v, i) => {
      const x = W - 40 - i * 46, y = yW + 26, capWait = v.cap > 0.01;
      const tipText = `سفينة MMSI ${v.mmsi}<br>زيارة ${v.id}<br>تنتظر منذ ${hrs(v.waited)}<br>` +
        (capWait ? `تنتظر رصيفًا شاغرًا منذ ${hrs(v.cap)}` : `موعد رسوها المسجل بعد ${hrs(Math.max(0, v.sched))}`);
      s += `<g class="hit" data-tip="${esc(tipText)}"><circle cx="${x}" cy="${y}" r="15" fill="${capWait ? 'rgba(246,131,124,.25)' : 'rgba(243,182,87,.25)'}"
        stroke="${capWait ? '#F6837C' : '#F3B657'}" stroke-width="1.6"/></g>`;
    });
    if (!st.waiting.length) s += `<text x="${W - 40}" y="${yW + 30}" fill="#3ED0B6" font-size="12">لا توجد سفن منتظرة</text>`;
    const yC = yW + 70;
    s += `<text x="${W - 20}" y="${yC}" fill="#A3B4CA" font-size="13">قادمة حتى نهاية الأفق (${num(st.coming.length)})</text>`;
    const span = W - 260;
    s += `<line x1="${W - 40}" y1="${yC + 26}" x2="${W - 40 - span}" y2="${yC + 26}" stroke="#38597F" stroke-dasharray="3 5"/>`;
    st.coming.forEach(v => {
      const x = W - 40 - Math.min(1, v.eta / Math.max(1, H - HOUR)) * span;
      s += `<g class="hit" data-tip="${esc(`سفينة MMSI ${v.mmsi}<br>زيارة ${v.id}<br>تصل بعد ${hrs(v.eta)}`)}"><circle cx="${x}" cy="${yC + 26}" r="9" fill="transparent" stroke="#A3B4CA" stroke-width="1.6"/></g>`;
    });
    s = `<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="3" height="6" fill="rgba(163,180,202,.35)"/></pattern></defs>` + s;
    const svg = $('mapSvg');
    svg.setAttribute('viewBox', `0 0 ${W} ${yC + 50}`);
    svg.innerHTML = s;
    bindTips(svg);
  }

  // ---------- chart ----------
  function drawChart() {
    const r = result(SEL), tl = r.timeline, W = 700, Hh = 190, pl = 34, pr = 10, pt = 10, pb = 26;
    const maxY = Math.max(r.kpis.open_berths, ...tl.map(p => Math.max(p.at_berth, p.waiting))) + 1;
    const X = h => W - pr - (h / (tl.length - 1)) * (W - pl - pr);   // RTL: hour 0 on the right
    const Y = v => pt + (1 - v / maxY) * (Hh - pt - pb);
    const line = key => tl.map((p, i) => `${i ? 'L' : 'M'}${X(p.hour).toFixed(1)},${Y(p[key]).toFixed(1)}`).join(' ');
    let s = '';
    for (let v = 0; v <= maxY; v += Math.max(1, Math.ceil(maxY / 5))) {
      s += `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#38597F" stroke-width=".5"/>
            <text x="${pl - 6}" y="${Y(v) + 4}" fill="#A3B4CA" font-size="10" text-anchor="end" font-family="IBM Plex Mono">${v}</text>`;
    }
    tl.forEach(p => { if (p.hour % 6 === 0) s += `<text x="${X(p.hour)}" y="${Hh - 8}" fill="#A3B4CA" font-size="10" text-anchor="middle" font-family="IBM Plex Mono">+${p.hour}h</text>`; });
    s += `<line x1="${pl}" x2="${W - pr}" y1="${Y(r.kpis.open_berths)}" y2="${Y(r.kpis.open_berths)}" stroke="#A3B4CA" stroke-dasharray="5 4"/>`;
    s += `<path d="${line('at_berth')}" fill="none" stroke="#7FB2E5" stroke-width="2"/>`;
    s += `<path d="${line('waiting')}" fill="none" stroke="#F3B657" stroke-width="2"/>`;
    $('chartSvg').innerHTML = s;
  }

  // ---------- tooltips ----------
  function bindTips(root) {
    const tip = $('tip');
    root.querySelectorAll('.hit').forEach(g => {
      g.addEventListener('mousemove', e => { tip.innerHTML = g.dataset.tip; tip.style.display = 'block';
        tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });
      g.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
    });
  }

  $('ctlForm').addEventListener('submit', analyze);
})();
</script>
</body>
</html>
