# Marsa MVP - port configuration and assumptions.
# Every value has a source tag. ASSUMPTION = modelling choice, CHOICE = design choice, not a measured fact.
port:
  name: "Port of Los Angeles (container chain only)"
  timezone_data: "UTC"
  timezone_operational: "America/Los_Angeles"
  ais_lon_split: -118.245        # ASSUMPTION: LA/LB boundary estimated from stationary-vessel map (checked against Marine Exchange daily counts)
  ais_lat_min_inner: 33.72       # ASSUMPTION: inside the breakwater

capacity:
  container_berths: 23
  container_berths_source: "Port of Los Angeles official Port 101 brochure, berths per container terminal: APM 6, TraPac 4, Yusen 3, Fenix 3, Everport 3, WBCT 2, China Shipping 2 (sum 23; the brochure does not print the total)."

model:                           # LEGACY: used only by src/marsa/data/features.py; the final
                                 # XGBoost model is configured in prediction_model/ and ml_contract below.
  target_column: "waiting_vessel_count"
  horizons_hours: [6, 12, 24]
  train_end: "2025-09-30 23:00"
  valid_end: "2025-10-31 23:00"
  excluded_features:             # reasons in docs/DATA_DICTIONARY.md
    - hour_key
    - yard_capacity
    - event_id
    - event_start
    - event_end
    - event_duration_hours
    - event_represented_hours
    - weather_pressure_index
    - event_active
    - event_type
    - event_severity
    - import_teu
    - yard_occupancy_percent
    - cargo_flow_ratio
    - operations_status
    - is_public_holiday
    - is_weekend

twin:
  horizon_hours: 24              # CHOICE (agreed, may change): how far ahead the twin simulates; the
                                 # interface marks +6 h, the prediction model's horizon
  similar_vessels_k: 5           # FROM DATA: chosen by scripts/select_similar_k.py (lowest error on
                                 # 2025 stays using only earlier stays); see data/processed/similar_k_selection.json
  # Everything else the twin needs (vessels, arrival/berth/service times) comes from AIS:
  # data/processed/la_cargo_calls_2023_2025.csv, built by scripts/build_la_cargo_calls.py.
  # The twin is deterministic (no random sampling) and ranks options by total vessel-hours waiting.

ml_contract:
  target: "operational_cargo_congestion_proxy"
  horizon_hours: 6
  model_version: "layer1-cargo-proxy-v1"
  artifact: "prediction_model/final_proxy/artifacts/XGBoost_6h/model.json"
  score_calibrated_as_probability: false
  prototype_scope: "retrospective finalized 2025 dataset"

strategy_investigation:
  enabled: true
  use_gemini: true
  max_rounds: 2
  max_tool_calls: 3
  window_hours: 6

adaptive_candidates:
  enabled: true
# Independent Phase 1 experiment. Existing replay/pipeline never reads this section.
# Every number below is a SYNTHETIC_SCENARIO_ASSUMPTION, not observed POLA capacity.
coupled_normalized:
  enabled: true
  mode: coupled_normalized
  parameters:
    yard_capacity: 10000.0
    initial_inventory: 0.0
    berth_slots: 1                # Abstract scenario resource pool, not POLA's 22 reported berths
    unloading_units_per_hour: 100.0  # Whole pool, not moves/crane-hour
    gate_units_per_hour: 100.0    # Assumed eligible-cargo service, not Cargo CSV departures
    release_delay_hours: 0       # New cargo eligible at the next interval opening
    initial_inventory_eligible_in_hours: 0
    units: normalized_units
    provenance: SYNTHETIC_SCENARIO_ASSUMPTION
  storage_sensitivity: [9090.91, 10000.0, 10909.09]
  reference_note: "Storage sensitivity is relative only; POLA 22 berths, 85 cranes and historical 27 moves/hour are not runtime inputs or conversions."

# Phase 2 is independently opt-in. Each request supplies its cohort and resource pool.
hybrid_normalized:
  enabled: true
  workload:
    method: constant_per_call_v1
    full_import_units: 1000.0           # SYNTHETIC_ESTIMATED; not TEU or measured cargo
    berthed_remaining_fraction: 0.5    # Unobserved progress; do not use future berth_end
    remaining_fraction_sensitivity: [0.25, 0.5, 0.75]

# Phase 3 experiment only: never consumed by Strategy or existing simulation routes.
sensitivity_analysis:
  enabled: true
  plan:
    storage_factors: [0.909091, 1.0, 1.090909]  # 9090.91 / 10000 / 10909.09 at base 10000
    rate_workload_factors: [0.5, 1.0, 1.5]    # Exploratory synthetic assumptions
    occupancy_low: 0.5
    occupancy_high: 1.0
    remaining_low: 0.25
    remaining_high: 0.75
    modest_increase: 0.2
    large_gate_factor: 3.0
    include_interactions: true

# Optional additive evidence only. Ordinary requests never trigger sensitivity.
strategy_decision_support:
  enabled: true
